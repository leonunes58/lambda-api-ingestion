name: cotacao_dolar
description: Cotação USD/BRL
api:
  url: https://economia.awesomeapi.com.br/json/last/USD-BRL
  method: GET
destination:
  # bucket: omitido de propósito, o Terraform preenche com o bucket raw do storage.tf
  # prefix: opcional, padrão = name
  partition: anomesdia # anomesdia | anomes
schedule: "cron(0 12 * * ? *)"
timeout: 30
memory: 128
